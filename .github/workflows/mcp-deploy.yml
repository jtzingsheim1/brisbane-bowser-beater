# Deploys the MCP subproject (mcp/ + infra/) to AWS.
#
# Security model:
# - No long-lived AWS credentials exist anywhere. This job assumes the
#   bootstrap-created bbb-mcp-deploy role via GitHub OIDC; the role's trust
#   policy only matches this repo's `aws` environment, and that environment
#   requires a human reviewer -- so credentials can only ever be minted for
#   a run a human has approved, from main.
# - Every action is pinned to a commit SHA (this workflow holds OIDC write
#   access, so no mutable tags).
# - The stack's API key value never appears in outputs or logs; it is
#   retrieved by the operator in CloudShell (see infra/BOOTSTRAP.md).
#
# Manual-only (workflow_dispatch): choose plan (preview), apply (deploy),
# or destroy (full decommission of the stack).

name: Deploy MCP stack

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        type: choice
        options: [plan, apply, destroy]
        default: plan
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: mcp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Apply can include knowledge-base creation plus corpus ingestion.
    timeout-minutes: 25
    environment: aws
    if: github.ref == 'refs/heads/main'
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_supabase_url: ${{ vars.SUPABASE_URL }}
      TF_VAR_supabase_anon_key: ${{ vars.SUPABASE_ANON_KEY }}
      TF_VAR_budget_alert_email: ${{ vars.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mcp/package-lock.json

      - name: Build server bundle
        working-directory: mcp
        run: |
          npm ci
          npm run check

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform ${{ inputs.action }}
        working-directory: infra
        run: |
          case "${{ inputs.action }}" in
            plan)    terraform plan -input=false ;;
            apply)   terraform apply -input=false -auto-approve ;;
            destroy) terraform destroy -input=false -auto-approve ;;
          esac

      - name: Show outputs
        if: inputs.action == 'apply'
        working-directory: infra
        run: terraform output

      # Ingestion has no Terraform resource (see docs/mcp-rag-design.md).
      # Day-to-day doc merges publish through the ungated corpus-sync.yml
      # workflow; this apply-time sync exists so a freshly created or
      # changed stack is populated immediately, without waiting for the
      # next doc merge. Both run the same shared script.
      - name: Sync docs corpus and ingest
        if: inputs.action == 'apply'
        working-directory: infra
        run: |
          set -euo pipefail
          # Separate statements, not an assignment prefix: under `set -e` a
          # failing substitution in a prefix does not abort the step, so a
          # missing output would reach the script as an empty variable.
          KB_ID=$(terraform output -raw knowledge_base_id)
          DS_ID=$(terraform output -raw data_source_id)
          CORPUS_BUCKET=$(terraform output -raw corpus_bucket)
          export KB_ID DS_ID CORPUS_BUCKET
          ../mcp/scripts/sync-corpus.sh
