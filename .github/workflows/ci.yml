# PR + main CI gate: lint, test, build.
#
# Runs on every pull request and on pushes to main. These are the same three
# checks we run locally (npm run lint / test / build). `next build` also runs
# the full TypeScript typecheck, so types are covered without a separate step.
#
# No real secrets needed: env reads in src/lib are lazy (request-time), and the
# pages that touch Supabase render dynamically, so the build never hits the DB.
# The dummy NEXT_PUBLIC_* values below are harmless placeholders that bulletproof
# the build against any accidental module-level env access.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same branch/PR to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

  # The MCP subproject (mcp/ + infra/) has its own dependency tree and its
  # own checks: typecheck, tests, esbuild bundle, and Terraform fmt/validate.
  # No AWS credentials are involved -- validate runs against provider schemas
  # only (-backend=false).
  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mcp/package-lock.json
      - name: Typecheck, test, build server
        working-directory: mcp
        run: |
          npm ci
          npm run check
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - name: Terraform fmt + validate
        working-directory: infra
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
